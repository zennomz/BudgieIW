services:
  app:
    image: zenomz/budgie-app:latest
    container_name: app
    volumes:
      - assets_data:/var/www/public
    networks:
      - budgie-app

  web:
    image: nginx:alpine
    container_name: budgie-web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - assets_data:/var/www/public
      - ./web_server/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - app
    networks:
      - budgie-app

  certbot:
    image: certbot/certbot:latest
    container_name: budgie-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - web

  mysql:
    image: mysql:8.0
    container_name: budgie-db
    environment:
      - MYSQL_ROOT_PASSWORD=kiqtib@25@05@13
      - MYSQL_DATABASE=budgie_db
      - MYSQL_USER=admin.budgie
      - MYSQL_PASSWORD=kiqtib@25@05@13
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - budgie-app

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: budgie-pma
    ports:
      - "8085:80"
    environment:
      - PMA_HOST=mysql
    networks:
      - budgie-app

  mailhog:
    image: mailhog/mailhog:latest
    container_name: budgie-mail
    ports:
      - "8025:8025"
    networks:
      - budgie-app

networks:
  budgie-app:

volumes:
  mysql_data:
  assets_data: